<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fraud Detection Dashboard</title>
</head>
<body>
    <h1>Fraud Detection Graph System</h1>
    <p>Graph-based fraud monitoring dashboard.</p>

    <section>
        <h2>Suspicious Devices</h2>
        <div id="devices"></div>
    </section>

    <script>
        fetch("/suspicious-devices")
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById("devices");

                data.suspicious_devices.forEach(device => {
                    container.innerHTML += `
                        <div>
                            <h3>Device: ${device.shared_device}</h3>
                            <p>Total users: ${device.total_users}</p>
                            <p>Users: ${device.users.join(", ")}</p>
                        </div>
                    `;
                });
            });
    </script>
</body>
</html>
